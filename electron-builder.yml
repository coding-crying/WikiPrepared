appId: com.wikiprepared.app
productName: WikiPrepared
copyright: Copyright 2024-2025

# Override main entry for production build
extraMetadata:
  main: build/main/index.js

# Directories
directories:
  output: dist
  buildResources: build

# Build output from webpack
files:
  - "build/**/*"
  - "package.json"
  - "!node_modules/*"

# Extra resources to include
extraResources:
  - from: "src/main/assets"
    to: "assets"
    filter:
      - "**/*"

# macOS configuration
mac:
  category: public.app-category.utilities
  icon: public/icons/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: "${productName} ${version}"
  icon: public/icons/icon.png
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# Windows configuration
win:
  icon: public/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icons/icon.ico
  uninstallerIcon: public/icons/icon.ico
  installerHeaderIcon: public/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WikiPrepared

portable:
  artifactName: "${productName}-${version}-portable.exe"

# Linux configuration
linux:
  icon: public/icons
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: "${productName}-${version}.AppImage"

deb:
  priority: optional
  compression: xz

# Auto-update configuration (for future use)
publish:
  provider: github
  owner: wikiprepared
  repo: wikiprepared

# Compression
compression: normal

# ASAR archive
asar: true
