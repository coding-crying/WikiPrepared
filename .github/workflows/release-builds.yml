name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            script: npm run dist:linux -- --publish never
            artifacts: |
              dist/*.AppImage
              dist/*.deb
              dist/latest-linux.yml
          - label: Windows
            # windows-latest now ships VS 2026 which @electron/node-gyp 10.2 can't parse.
            # Pin to windows-2022 (VS 2022) until we upgrade node-gyp.
            os: windows-2022
            script: npm run dist:win -- --publish never
            artifacts: |
              dist/*Setup*.exe
              dist/*portable.exe
              dist/*.blockmap
              dist/latest.yml
          - label: macOS
            os: macos-latest
            # No Developer ID yet: ad-hoc sign ("-") so Apple Silicon shows the normal
            # "unidentified developer -> Open Anyway" prompt instead of "app is damaged".
            # Replace with a real identity once the Apple Developer cert exists.
            script: npm run dist:mac -- --publish never -c.mac.identity=-
            artifacts: |
              dist/*.dmg
              dist/*.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build release artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.script }}

      - name: Verify macOS bundle signature and launch it
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for app in dist/mac*/WikiPrepared.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|flags' || true
            lipo -archs "$app/Contents/MacOS/WikiPrepared"
            find "$app" -name '*.node' -exec lipo -archs {} \;
          done
          app="dist/mac-arm64/WikiPrepared.app"
          [ -d "$app" ] || app="$(ls -d dist/mac*/WikiPrepared.app | head -1)"
          "$app/Contents/MacOS/WikiPrepared" > smoke.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then echo "App still running after 25 s"; kill "$pid"; else echo "App exited early"; cat smoke.log; exit 1; fi
          grep -iE 'ready|error' smoke.log | head -20 || true

      - name: Launch Windows portable build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/win-unpacked/WikiPrepared.exe
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Error "App exited early with code $($p.ExitCode)"; exit 1 }
          Write-Host "App still running after 25 s"
          Stop-Process -Id $p.Id -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**
          generate_release_notes: true
